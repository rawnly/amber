name: Release

# Pushing a vX.Y.Z tag publishes the CLI for every supported platform. The
# Lua library is the tagged commit itself; install.sh and `amber self-update`
# check it out next to the matching binary.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5
      - name: Check that the library version matches the tag
        run: |
          version=$(sed -n 's/^local M = { version = "\(.*\)" }$/\1/p' amber.lua)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "amber.lua says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Run checks
        run: mise run check
      - name: Build binaries
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*} arch=${target#*/}
            GOOS=$os GOARCH=$arch mise exec -- go build -trimpath \
              -ldflags "-s -w -X github.com/rawnly/amber/cli/internal/cli.Version=$GITHUB_REF_NAME" \
              -o "../dist/amber-$os-$arch" ./cmd/amber
          done
          cd ../dist && sha256sum amber-* >checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

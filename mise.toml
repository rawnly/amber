[tools]
lua = "5.1.5"
stylua = "2.3.1"
lua-language-server = "3.19.2"
shellcheck = "latest"
shfmt = "latest"
lefthook = "latest"
typos = "latest"

[tasks.test]
description = "Run Lua 5.1 tests"
run = ["sh scripts/test.sh", "sh scripts/test-install.sh"]

[tasks.fmt]
description = "Format Lua and shell files"
run = ["stylua amber.lua amber tests types", "shfmt -i 2 -w install.sh scripts/*.sh"]

[tasks."fmt:check"]
description = "Check Lua and shell formatting"
run = ["stylua --check amber.lua amber tests types", "shfmt -i 2 -d install.sh scripts/*.sh"]

[tasks.lint]
description = "Lint shell scripts"
run = "shellcheck -s sh install.sh scripts/*.sh"

[tasks.types]
description = "Run Lua Language Server diagnostics"
run = "lua-language-server --check . --checklevel Warning --check_format pretty"

[tasks.check]
description = "Check formatting, lint, types, Lua syntax, and tests"
depends = ["fmt:check", "lint", "test", "types"]
run = "luac -p amber.lua amber/*.lua tests/test.lua types/*.lua"
